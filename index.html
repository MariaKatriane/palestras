<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palestras — Maria Katriane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #d6336c; --rose-deep: #a61e4d; --petal: #fcd5e3;
    --mauve: #6b2a4a; --ink: #3b1a2c; --card: #ffffffcc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font-family: 'Poppins', system-ui, sans-serif;
    background: linear-gradient(135deg, #fff7fa 0%, #fde4ee 55%, #f3e5fb 100%) fixed;
  }
  main { max-width: 960px; margin: 0 auto; padding: 56px 16px 80px; }
  header { margin-bottom: 36px; }
  h1 { font-family: 'Playfair Display', serif; color: var(--mauve); font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 6px; }
  header p { margin: 0; font-weight: 300; font-size: 1.1rem; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .card {
    display: flex; flex-direction: column; gap: 10px; padding: 24px;
    background: var(--card); border: 1px solid var(--petal); border-radius: 16px;
    text-decoration: none; color: inherit;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px); border-color: var(--rose);
    box-shadow: 0 10px 28px #d6336c22; outline: none;
  }
  .card h2 { font-family: 'Playfair Display', serif; color: var(--mauve); font-size: 1.35rem; margin: 0; }
  .card p { margin: 0; font-weight: 300; line-height: 1.5; flex: 1; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .8rem; }
  .tag { background: var(--petal); color: var(--rose-deep); padding: 2px 10px; border-radius: 99px; font-weight: 500; }
  .date { color: #8a6376; margin-left: auto; }
  .go { color: var(--rose-deep); font-weight: 600; font-size: .9rem; }
  .empty { font-weight: 300; }
  @media (prefers-color-scheme: dark) {
    :root { --card: #2a1422cc; --petal: #5a2a44; --ink: #f6e6ee; --mauve: #f3b9d2; --rose-deep: #ff8fb8; }
    body { background: linear-gradient(135deg, #1d0e17 0%, #2b1424 55%, #231730 100%) fixed; }
    .date { color: #c9a0b5; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Minhas palestras</h1>
    <p>Escolha uma para apresentar.</p>
  </header>
  <div class="grid" id="grid"></div>
</main>
<script src="talks.js"></script>
<script>
  const grid = document.getElementById('grid');
  const talks = (window.TALKS || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const fmt = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }) : '';

  if (!talks.length) {
    grid.innerHTML = '<p class="empty">Nenhuma palestra cadastrada ainda. Edite o arquivo talks.js.</p>';
  }
  for (const t of talks) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `talks/${t.folder}/index.html`;
    const h2 = document.createElement('h2'); h2.textContent = t.title;
    const p = document.createElement('p'); p.textContent = t.description || '';
    const meta = document.createElement('div'); meta.className = 'meta';
    for (const tag of t.tags || []) {
      const s = document.createElement('span'); s.className = 'tag'; s.textContent = tag; meta.append(s);
    }
    const d = document.createElement('span'); d.className = 'date'; d.textContent = fmt(t.date); meta.append(d);
    const go = document.createElement('span'); go.className = 'go'; go.textContent = 'Apresentar →';
    a.append(h2, p, meta, go);
    grid.append(a);
  }
</script>
</body>
</html>
